name: Update daily prices

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Generar CSV de precios
        run: |
          python tools/generate_prices_csv.py

      - name: Comprobar cambios
        run: |
          git status

      - name: Subir CSV actualizado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/data/prices_daily.csv assets/data/failed_tickers.txt
          git commit -m "Update daily prices" || echo "No hay cambios"
          git push
