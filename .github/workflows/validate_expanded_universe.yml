name: Validate expanded market universe

on:
  push:
    paths:
      - ".github/workflows/validate_expanded_universe.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validation report
        shell: python
        run: |
          import csv
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          def clean_tickers(text):
              out = []
              seen = set()
              for raw in text.splitlines():
                  ticker = raw.strip()
                  if not ticker or ticker.startswith("#") or ticker in seen:
                      continue
                  seen.add(ticker)
                  out.append(ticker)
              return out

          current_text = Path("assets/data/tickers.txt").read_text(encoding="utf-8")
          main_text = subprocess.check_output(
              ["git", "show", "origin/main:assets/data/tickers.txt"],
              text=True,
          )
          current = clean_tickers(current_text)
          base = set(clean_tickers(main_text))
          added = [ticker for ticker in current if ticker not in base]

          stats = defaultdict(lambda: {"rows": 0, "first": "", "last": ""})
          added_set = set(added)
          with Path("assets/data/prices_daily.csv").open(newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  ticker = row["ticker"]
                  if ticker not in added_set:
                      continue
                  date = row["date"]
                  item = stats[ticker]
                  item["rows"] += 1
                  if not item["first"] or date < item["first"]:
                      item["first"] = date
                  if not item["last"] or date > item["last"]:
                      item["last"] = date

          latest = set()
          with Path("assets/data/latest_prices.csv").open(newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  latest.add(row["ticker"])

          failed = {}
          failed_path = Path("assets/data/failed_tickers.txt")
          if failed_path.exists():
              for raw in failed_path.read_text(encoding="utf-8").splitlines():
                  if " | " in raw:
                      ticker, reason = raw.split(" | ", 1)
                      failed[ticker.strip()] = reason.strip()

          out_path = Path("assets/data/market_universe_validation.csv")
          with out_path.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(
                  fh,
                  fieldnames=[
                      "ticker", "history_rows", "first_date", "last_date",
                      "latest_present", "failed_reason",
                  ],
              )
              writer.writeheader()
              for ticker in added:
                  item = stats[ticker]
                  writer.writerow({
                      "ticker": ticker,
                      "history_rows": item["rows"],
                      "first_date": item["first"],
                      "last_date": item["last"],
                      "latest_present": "yes" if ticker in latest else "no",
                      "failed_reason": failed.get(ticker, ""),
                  })

          missing_history = [t for t in added if stats[t]["rows"] == 0]
          missing_latest = [t for t in added if t not in latest]
          print(f"Added tickers: {len(added)}")
          print(f"Missing history: {missing_history}")
          print(f"Missing latest: {missing_latest}")
          print(f"Provider failures among additions: {[t for t in added if t in failed]}")

      - name: Commit validation report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/data/market_universe_validation.csv
          git commit -m "Add temporary market universe validation report" || echo "No changes"
          git push
